name: Recon
on: workflow_dispatch
permissions:
  contents: write
jobs:
  recon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Поиск по LoginActivity
        run: |
          S=TMessagesProj/src/main/java/org/telegram/ui/LoginActivity.java
          {
            echo "=== размер файла ==="
            wc -l "$S"

            echo; echo "=== классы-страницы (ViewPage), ищем экран ввода номера ==="
            grep -n "class.*Phone.*View\|class.*ViewPage\|PhoneView extends\|setPage(" "$S" | cut -c1-200 | head -60

            echo; echo "=== кнопка 'далее' / стрелка (floatingButton) ==="
            grep -n "floatingButton\|floatingButtonIcon\|FloatingActionButton\|nextPressed\|onNextPressed" "$S" | cut -c1-200 | head -60

            echo; echo "=== строка 'Страна' / countryButton ==="
            grep -n "countryButton\|CountrySelectActivity\|countryState" "$S" | cut -c1-200 | head -40

            echo; echo "=== верхняя панель / actionBar в LoginActivity ==="
            grep -n "actionBar.setBackButtonImage\|createView(Context context)\|class PhoneView" "$S" | cut -c1-200 | head -40
          } > recon_login.txt
          wc -l recon_login.txt

      - name: Выложить результат в ветку recon-out
        run: |
          mkdir /tmp/out && cp recon_login.txt /tmp/out/
          git config user.name "recon-bot"
          git config user.email "recon@users.noreply.github.com"
          git checkout --orphan recon-out
          git rm -rf . > /dev/null
          cp /tmp/out/recon_login.txt .
          git add recon_login.txt
          git commit -m "recon login"
          git push -f origin recon-out
          RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/recon-out/recon_login.txt"
          echo "- Raw (пришли Claude): $RAW" >> "$GITHUB_STEP_SUMMARY"
