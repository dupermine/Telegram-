package org.telegram.messenger.bots;

public class BotAccount {
    public String token;
    public long botId;
    public String username;
    public String firstName;
    public long updatesOffset;

    public BotAccount() {}

    public BotAccount(String token, long botId, String username, String firstName) {
        this.token = token;
        this.botId = botId;
        this.username = username;
        this.firstName = firstName;
    }
}
