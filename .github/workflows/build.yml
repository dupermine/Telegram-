name: Build Telegram fork
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Сменить имя пакета
        env:
          NEW_PKG: com.dupermine.tgfork
        run: |
          echo "--- где упоминается APP_PACKAGE ---"
          grep -rn "APP_PACKAGE" --include=*.properties --include=*.gradle --include=*.kts . | grep -v "/build/" | cut -c1-200 || true

          FILES=$(grep -rlE '^\s*(ext\.)?APP_PACKAGE\s*=' --include=*.properties --include=*.gradle --include=*.kts . | grep -v "/build/" || true)
          echo "Файлы с определением: $FILES"
          if [ -z "$FILES" ]; then
            echo "ОШИБКА: определение APP_PACKAGE не найдено (см. список выше)"
            exit 1
          fi
          for F in $FILES; do
            perl -pi -e 's/^(\s*(?:ext\.)?APP_PACKAGE\s*=\s*)(["\x27]?)[^"\x27\r\n]+\2(\r?)$/$1$2$ENV{NEW_PKG}$2$3/' "$F"
            echo "--- $F после замены ---"
            grep -n "APP_PACKAGE" "$F"
          done
          if ! grep -q "$NEW_PKG" $FILES; then
            echo "ОШИБКА: APP_PACKAGE не заменён"
            exit 1
          fi

          for M in $(find . -name AndroidManifest.xml -not -path "*/build/*"); do
            sed -i -E 's/android:name="org\.telegram\.messenger(\.web|\.beta)?\.permission\./android:name="${applicationId}.permission./g' "$M"
            sed -i -E 's/android:authorities="org\.telegram\.messenger(\.web|\.beta)?\./android:authorities="${applicationId}./g' "$M"
          done
          echo "--- разрешения и authorities в манифестах ---"
          grep -rn "\.permission\.\|authorities" --include=AndroidManifest.xml . | grep -v "/build/" | grep -v "android\.permission" | cut -c1-200 || true

          echo "--- google-services.json: добавляем записи для нового пакета ---"
          python3 - <<'PY'
          import copy
          import glob
          import json
          import os

          new = os.environ["NEW_PKG"]
          targets = [new, new + ".web", new + ".beta"]
          found = 0
          for f in glob.glob("**/google-services.json", recursive=True):
              if "/build/" in f:
                  continue
              with open(f, encoding="utf-8") as fh:
                  data = json.load(fh)
              clients = data.get("client", [])
              if not clients:
                  print("нет client в", f)
                  continue
              have = {c["client_info"]["android_client_info"]["package_name"] for c in clients}
              base = clients[0]
              for t in targets:
                  if t in have:
                      continue
                  c = copy.deepcopy(base)
                  c["client_info"]["android_client_info"]["package_name"] = t
                  clients.append(c)
              with open(f, "w", encoding="utf-8") as fh:
                  json.dump(data, fh, ensure_ascii=False, indent=2)
              found += 1
              print("обновлён:", f)
              print("  пакеты:", sorted(c["client_info"]["android_client_info"]["package_name"] for c in clients))
          if found == 0:
              print("ПРЕДУПРЕЖДЕНИЕ: google-services.json не найден")
          PY

      - name: Добавить файлы (боты и tdata)
        run: |
          python3 - <<'PY'
          import os
          ROOT = "TMessagesProj/src/main/java/org/telegram"
          os.makedirs(f"{ROOT}/messenger/bots", exist_ok=True)
          os.makedirs(f"{ROOT}/messenger/tdimport", exist_ok=True)

          files = {}

          files[f"{ROOT}/messenger/bots/BotApiClient.java"] = r'''
package org.telegram.messenger.bots;

import org.json.JSONArray;
import org.json.JSONObject;

import java.io.ByteArrayOutputStream;
import java.io.InputStream;
import java.io.OutputStream;
import java.net.HttpURLConnection;
import java.net.URL;
import java.net.URLConnection;
import java.net.URLEncoder;

/** Прямые вызовы Telegram Bot API (api.telegram.org). */
public class BotApiClient {

    public static class ApiException extends Exception {
        public ApiException(String m) { super(m); }
    }

    private final String token;

    public BotApiClient(String token) {
        this.token = token;
    }

    private String base() {
        return "https://api.telegram.org/bot" + token + "/";
    }

    public JSONObject getMe() throws Exception {
        return call("getMe", null, 15000);
    }

    public JSONArray getUpdates(long offset, int timeoutSec) throws Exception {
        JSONObject params = new JSONObject();
        params.put("offset", offset);
        params.put("timeout", timeoutSec);
        params.put("allowed_updates", new JSONArray().put("message").put("edited_message").put("callback_query"));
        JSONObject res = call("getUpdates", params, (timeoutSec + 10) * 1000);
        return res.getJSONArray("result");
    }

    public JSONObject sendMessage(long chatId, String text, Long replyToMessageId) throws Exception {
        JSONObject params = new JSONObject();
        params.put("chat_id", chatId);
        params.put("text", text);
        if (replyToMessageId != null) params.put("reply_to_message_id", replyToMessageId);
        return call("sendMessage", params, 20000);
    }

    public JSONObject sendPhoto(long chatId, String filePath, String caption) throws Exception {
        String boundary = "----KTBoundary" + System.currentTimeMillis();
        URL url = new URL(base() + "sendPhoto");
        HttpURLConnection c = (HttpURLConnection) url.openConnection();
        c.setDoOutput(true);
        c.setConnectTimeout(15000);
        c.setReadTimeout(30000);
        c.setRequestMethod("POST");
        c.setRequestProperty("Content-Type", "multipart/form-data; boundary=" + boundary);
        try (OutputStream os = c.getOutputStream()) {
            writeField(os, boundary, "chat_id", String.valueOf(chatId));
            if (caption != null) writeField(os, boundary, "caption", caption);
            writeFileField(os, boundary, "photo", filePath);
            os.write(("--" + boundary + "--\r\n").getBytes("UTF-8"));
        }
        return readJson(c);
    }

    private void writeField(OutputStream os, String boundary, String name, String value) throws Exception {
        os.write(("--" + boundary + "\r\n").getBytes("UTF-8"));
        os.write(("Content-Disposition: form-data; name=\"" + name + "\"\r\n\r\n").getBytes("UTF-8"));
        os.write((value + "\r\n").getBytes("UTF-8"));
    }

    private void writeFileField(OutputStream os, String boundary, String name, String path) throws Exception {
        java.io.File f = new java.io.File(path);
        os.write(("--" + boundary + "\r\n").getBytes("UTF-8"));
        os.write(("Content-Disposition: form-data; name=\"" + name + "\"; filename=\"" + f.getName() + "\"\r\n").getBytes("UTF-8"));
        os.write("Content-Type: application/octet-stream\r\n\r\n".getBytes("UTF-8"));
        try (InputStream in = new java.io.FileInputStream(f)) {
            byte[] buf = new byte[8192];
            int n;
            while ((n = in.read(buf)) > 0) os.write(buf, 0, n);
        }
        os.write("\r\n".getBytes("UTF-8"));
    }

    private JSONObject call(String method, JSONObject params, int timeoutMs) throws Exception {
        StringBuilder q = new StringBuilder();
        if (params != null) {
            java.util.Iterator<String> it = params.keys();
            boolean first = true;
            while (it.hasNext()) {
                String k = it.next();
                if (!first) q.append('&');
                first = false;
                q.append(URLEncoder.encode(k, "UTF-8")).append('=')
                 .append(URLEncoder.encode(String.valueOf(params.get(k)), "UTF-8"));
            }
        }
        URL url = new URL(base() + method + (q.length() > 0 ? "?" + q : ""));
        HttpURLConnection c = (HttpURLConnection) url.openConnection();
        c.setConnectTimeout(15000);
        c.setReadTimeout(timeoutMs);
        return readJson(c);
    }

    private JSONObject readJson(URLConnection c) throws Exception {
        InputStream in = ((HttpURLConnection) c).getResponseCode() >= 400
                ? ((HttpURLConnection) c).getErrorStream() : c.getInputStream();
        ByteArrayOutputStream bo = new ByteArrayOutputStream();
        byte[] buf = new byte[4096];
        int n;
        while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
        JSONObject res = new JSONObject(bo.toString("UTF-8"));
        if (!res.optBoolean("ok", false)) {
            throw new ApiException(res.optString("description", "Bot API error"));
        }
        return res;
    }
}
'''

