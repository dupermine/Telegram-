      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK, NDK, CMake
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Сборка
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_AppStandalone:assembleAfatStandalone 2>&1 | tee build.log

      - name: Выложить ошибки сборки (только при падении)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pub
          {
            echo "=== место на диске ==="; df -h / | tail -2
            echo; echo "=== ключевые строки ==="
            grep -n -E "error:|FAILED|What went wrong|Caused by|OutOfMemory|No space left|Execution failed|Could not|No matching client" build.log | cut -c1-300 | head -80
            echo; echo "=== последние 120 строк ==="
            tail -120 build.log | cut -c1-300
          } > /tmp/pub/buildlog.txt
          cd /tmp/pub
          git init -q -b recon-out
          git config user.name "recon-bot"
          git config user.email "recon@users.noreply.github.com"
          git add buildlog.txt
          git commit -q -m "build log"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin recon-out
          RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/recon-out/buildlog.txt"
          echo "Лог ошибки: $RAW"
          echo "- Лог ошибки (пришли Claude): $RAW" >> "$GITHUB_STEP_SUMMARY"

      - name: Показать найденные APK
        run: find . -name "*.apk" -not -path "./.git/*" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-fork-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
