          files[f"{ROOT}/messenger/bots/BotPollingService.java"] = r'''
package org.telegram.messenger.bots;

import android.app.Notification;
import android.app.NotificationChannel;
import android.app.NotificationManager;
import android.app.Service;
import android.content.Intent;
import android.os.Build;
import android.os.IBinder;

import org.json.JSONArray;
import org.json.JSONObject;

import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;

public class BotPollingService extends Service {

    private static final ExecutorService EXEC = Executors.newCachedThreadPool();
    private volatile boolean running = false;

    public interface Listener {
        void onBotMessage(long botId, JSONObject message);
    }

    private static Listener listener;
    public static void setListener(Listener l) { listener = l; }

    @Override
    public IBinder onBind(Intent intent) { return null; }

    @Override
    public int onStartCommand(Intent intent, int flags, int startId) {
        if (Build.VERSION.SDK_INT >= 26) {
            NotificationManager nm = getSystemService(NotificationManager.class);
            nm.createNotificationChannel(new NotificationChannel("kt_bots", "Боты", NotificationManager.IMPORTANCE_LOW));
            Notification n = new Notification.Builder(this, "kt_bots")
                    .setSmallIcon(android.R.drawable.ic_dialog_email)
                    .setContentTitle("Боты подключены")
                    .build();
            startForeground(777, n);
        }
        running = true;
        for (BotAccount b : BotAccountsStore.load(this)) startPolling(b);
        return START_STICKY;
    }

    @Override
    public void onDestroy() { running = false; super.onDestroy(); }

    private void startPolling(BotAccount acc) {
        EXEC.execute(() -> {
            BotApiClient api = new BotApiClient(acc.token);
            long offset = acc.updatesOffset;
            while (running) {
                try {
                    JSONArray updates = api.getUpdates(offset, 25);
                    for (int i = 0; i < updates.length(); i++) {
                        JSONObject upd = updates.getJSONObject(i);
                        offset = upd.getLong("update_id") + 1;
                        JSONObject msg = upd.optJSONObject("message");
                        if (msg != null && listener != null) {
                            listener.onBotMessage(acc.botId, msg);
                        }
                    }
                    if (updates.length() > 0) {
                        BotAccountsStore.updateOffset(this, acc.botId, offset);
                    }
                } catch (Exception e) {
                    try { Thread.sleep(5000); } catch (InterruptedException ignored) {}
                }
            }
        });
    }
}
'''

          files[f"{ROOT}/messenger/tdimport/TDataImporter.java"] = r'''
package org.telegram.messenger.tdimport;

import java.io.ByteArrayOutputStream;
import java.io.File;
import java.io.FileInputStream;
import java.nio.ByteBuffer;
import java.nio.ByteOrder;
import java.security.MessageDigest;
import java.util.ArrayList;
import java.util.List;
import java.util.zip.ZipEntry;
import java.util.zip.ZipInputStream;

import javax.crypto.Cipher;
import javax.crypto.spec.SecretKeySpec;

/**
 * ЭКСПЕРИМЕНТАЛЬНО. Разбор локального хранилища Telegram Desktop (tdata)
 * для аккаунтов БЕЗ локального пароля Desktop. Код не проверялся на
 * реальных файлах tdata — перед использованием с основным аккаунтом
 * протестируйте на второстепенном.
 */
public class TDataImporter {

    public static class Account {
        public long userId;
        public int dcId;
        public byte[] authKey;
    }

    public static class ImportException extends Exception {
        public ImportException(String m) { super(m); }
        public ImportException(String m, Throwable t) { super(m, t); }
    }

    public static File extractZip(File zipFile, File outDir) throws ImportException {
        try {
            outDir.mkdirs();
            try (ZipInputStream zis = new ZipInputStream(new FileInputStream(zipFile))) {
                ZipEntry e;
                byte[] buf = new byte[8192];
                while ((e = zis.getNextEntry()) != null) {
                    if (e.isDirectory()) continue;
                    String name = e.getName().replace('\\', '/');
                    File out = new File(outDir, name);
                    out.getParentFile().mkdirs();
                    try (java.io.FileOutputStream fos = new java.io.FileOutputStream(out)) {
                        int n;
                        while ((n = zis.read(buf)) > 0) fos.write(buf, 0, n);
                    }
                }
            }
            File found = findTDataRoot(outDir);
            if (found == null) throw new ImportException("В архиве не найдена папка tdata (файл key_data не обнаружен)");
            return found;
        } catch (ImportException e) {
            throw e;
        } catch (Exception e) {
            throw new ImportException("Не удалось распаковать архив", e);
        }
    }

    private static File findTDataRoot(File dir) {
        File[] list = dir.listFiles();
        if (list == null) return null;
        for (File f : list) {
            if (f.isFile() && (f.getName().equals("key_data") || f.getName().equals("key_datas"))) {
                return dir;
            }
        }
        for (File f : list) {
            if (f.isDirectory()) {
                File r = findTDataRoot(f);
                if (r != null) return r;
            }
        }
        return null;
    }

    public static List<Account> importAccounts(File tdataDir) throws ImportException {
        try {
            File keyFile = new File(tdataDir, "key_data");
            if (!keyFile.exists()) keyFile = new File(tdataDir, "key_datas");
            if (!keyFile.exists()) throw new ImportException("Файл key_data не найден");

            byte[] raw = readAll(keyFile);
            if (raw.length < 24 || raw[0] != 'T' || raw[1] != 'D' || raw[2] != 'F' || raw[3] != '$') {
                throw new ImportException("Неожиданный формат key_data (не TDF$). Эта версия Telegram Desktop пока не поддерживается.");
            }
            byte[] payload = java.util.Arrays.copyOfRange(raw, 8, raw.length - 16);

            QReader r = new QReader(payload);
            byte[] salt = r.readByteArray();
            byte[] keyEncrypted = r.readByteArray();
            byte[] localKey = createLocalKey(salt, new byte[0], 1);
            byte[] keyDecrypted = decryptLocal(keyEncrypted, localKey);
            if (keyDecrypted == null) {
                throw new ImportException("Не удалось расшифровать key_data: похоже, на Desktop установлен локальный пароль — импорт такого аккаунта пока не поддерживается.");
            }

            byte[] mainLocalKey = java.util.Arrays.copyOf(keyDecrypted, 256);

            File mapFile = new File(tdataDir, "map0");
            if (!mapFile.exists()) mapFile = new File(tdataDir, "map1");
            if (!mapFile.exists()) throw new ImportException("Файл map0/map1 не найден");

            byte[] mapRaw = readAll(mapFile);
            if (mapRaw.length < 24 || mapRaw[0] != 'T' || mapRaw[1] != 'D' || mapRaw[2] != 'F' || mapRaw[3] != '$') {
                throw new ImportException("Неожиданный формат map0 (не TDF$)");
            }
            byte[] mapPayload = java.util.Arrays.copyOfRange(mapRaw, 8, mapRaw.length - 16);
            byte[] mapDecrypted = decryptLocal(mapPayload, mainLocalKey);
            if (mapDecrypted == null) {
                throw new ImportException("Не удалось расшифровать map0 основным ключом");
            }

            List<Account> result = new ArrayList<>();
            QReader mr = new QReader(mapDecrypted);
            while (mr.hasMore(4)) {
                int tag = mr.tryReadTag();
                if (tag == TAG_MTP_AUTHORIZATION) {
                    byte[] authBlock = mr.readByteArray();
                    QReader ar = new QReader(authBlock);
                    int userId32 = ar.readInt32();
                    int mainDc = ar.readInt32();
                    int count = ar.readInt32();
                    for (int i = 0; i < count; i++) {
                        int dcId = ar.readInt32();
                        byte[] key = ar.readFixed(256);
                        Account acc = new Account();
                        acc.userId = userId32 & 0xFFFFFFFFL;
                        acc.dcId = dcId;
                        acc.authKey = key;
                        result.add(acc);
                    }
                    break;
                }
            }
            if (result.isEmpty()) {
                throw new ImportException("Авторизация не найдена в map0 (формат файла не распознан)");
            }
            return result;
        } catch (ImportException e) {
            throw e;
        } catch (Exception e) {
            throw new ImportException("Ошибка разбора tdata: " + e.getMessage(), e);
        }
    }

    private static final int TAG_MTP_AUTHORIZATION = 0x4D544150;

    private static byte[] createLocalKey(byte[] salt, byte[] passcode, int iterations) throws Exception {
        MessageDigest sha512 = MessageDigest.getInstance("SHA-512");
        sha512.update(salt);
        sha512.update(passcode);
        sha512.update(salt);
        byte[] hashKey = sha512.digest();

        javax.crypto.spec.PBEKeySpec spec = new javax.crypto.spec.PBEKeySpec(
                bytesToChars(hashKey), salt, iterations, 256 * 8);
        javax.crypto.SecretKeyFactory f = javax.crypto.SecretKeyFactory.getInstance("PBKDF2WithHmacSHA512");
        return f.generateSecret(spec).getEncoded();
    }

    private static char[] bytesToChars(byte[] b) {
        char[] c = new char[b.length];
        for (int i = 0; i < b.length; i++) c[i] = (char) (b[i] & 0xFF);
        return c;
    }

    private static byte[] decryptLocal(byte[] encrypted, byte[] localKey) throws Exception {
        if (encrypted.length < 16) return null;
        byte[] msgKey = java.util.Arrays.copyOfRange(encrypted, 0, 16);
        byte[] data = java.util.Arrays.copyOfRange(encrypted, 16, encrypted.length);

        int x = 8;
        MessageDigest sha1 = MessageDigest.getInstance("SHA-1");
        sha1.update(msgKey); sha1.update(localKey, x, 32);
        byte[] sha1a = sha1.digest();
        sha1.reset();
        sha1.update(localKey, 32 + x, 16); sha1.update(msgKey); sha1.update(localKey, 48 + x, 16);
        byte[] sha1b = sha1.digest();
        sha1.reset();
        sha1.update(localKey, 64 + x, 32); sha1.update(msgKey);
        byte[] sha1c = sha1.digest();
        sha1.reset();
        sha1.update(msgKey); sha1.update(localKey, 96 + x, 32);
        byte[] sha1d = sha1.digest();

        byte[] aesKey = concat(slice(sha1a, 0, 8), slice(sha1b, 8, 20), slice(sha1c, 4, 16));
        byte[] aesIv = concat(slice(sha1a, 8, 20), slice(sha1b, 0, 8), slice(sha1c, 16, 20), slice(sha1d, 0, 8));

        byte[] decrypted = aesIgeDecrypt(data, aesKey, aesIv);

        MessageDigest sha1chk = MessageDigest.getInstance("SHA-1");
        byte[] check = sha1chk.digest(decrypted);
        byte[] checkShort = java.util.Arrays.copyOf(check, 16);
        if (!java.util.Arrays.equals(checkShort, msgKey)) {
            return null;
        }
        int len = ByteBuffer.wrap(decrypted, 0, 4).order(ByteOrder.LITTLE_ENDIAN).getInt();
        if (len < 0 || len > decrypted.length - 4) return null;
        return java.util.Arrays.copyOfRange(decrypted, 4, 4 + len);
    }

    private static byte[] aesIgeDecrypt(byte[] data, byte[] key, byte[] iv) throws Exception {
        byte[] ivPrev = java.util.Arrays.copyOfRange(iv, 0, 16);
        byte[] ivCur = java.util.Arrays.copyOfRange(iv, 16, 32);
        Cipher cipher = Cipher.getInstance("AES/ECB/NoPadding");
        cipher.init(Cipher.DECRYPT_MODE, new SecretKeySpec(key, "AES"));
        ByteArrayOutputStream out = new ByteArrayOutputStream();
        for (int i = 0; i < data.length; i += 16) {
            byte[] block = java.util.Arrays.copyOfRange(data, i, i + 16);
            byte[] x = xor(block, ivCur);
            byte[] y = cipher.doFinal(x);
            byte[] plain = xor(y, ivPrev);
            out.write(plain);
            ivPrev = block;
            ivCur = plain;
        }
        return out.toByteArray();
    }

    private static byte[] xor(byte[] a, byte[] b) {
        byte[] r = new byte[a.length];
        for (int i = 0; i < a.length; i++) r[i] = (byte) (a[i] ^ b[i]);
        return r;
    }

    private static byte[] slice(byte[] a, int from, int to) {
        return java.util.Arrays.copyOfRange(a, from, to);
    }

    private static byte[] concat(byte[]... parts) {
        int len = 0;
        for (byte[] p : parts) len += p.length;
        byte[] r = new byte[len];
        int pos = 0;
        for (byte[] p : parts) { System.arraycopy(p, 0, r, pos, p.length); pos += p.length; }
        return r;
    }

    private static byte[] readAll(File f) throws Exception {
        try (FileInputStream in = new FileInputStream(f)) {
            ByteArrayOutputStream out = new ByteArrayOutputStream();
            byte[] buf = new byte[8192];
            int n;
            while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
            return out.toByteArray();
        }
    }

    private static class QReader {
        private final ByteBuffer buf;
        QReader(byte[] data) { buf = ByteBuffer.wrap(data).order(ByteOrder.BIG_ENDIAN); }
        boolean hasMore(int n) { return buf.remaining() >= n; }
        int readInt32() { return buf.getInt(); }
        int tryReadTag() { return buf.getInt(); }
        byte[] readFixed(int n) { byte[] b = new byte[n]; buf.get(b); return b; }
        byte[] readByteArray() {
            int len = buf.getInt();
            if (len < 0) return new byte[0];
            byte[] b = new byte[len];
            buf.get(b);
            return b;
        }
    }
}
'''

          for path, content in files.items():
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("создан:", path, len(content), "байт")
          PY

