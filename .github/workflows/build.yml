          files[f"{ROOT}/messenger/bots/BotAccountsStore.java"] = r'''
package org.telegram.messenger.bots;

import android.content.Context;
import android.content.SharedPreferences;

import org.json.JSONArray;
import org.json.JSONObject;

import java.util.ArrayList;
import java.util.List;

public class BotAccountsStore {

    private static SharedPreferences prefs(Context c) {
        return c.getSharedPreferences("kt_bot_accounts", Context.MODE_PRIVATE);
    }

    public static List<BotAccount> load(Context c) {
        List<BotAccount> out = new ArrayList<>();
        try {
            JSONArray arr = new JSONArray(prefs(c).getString("list", "[]"));
            for (int i = 0; i < arr.length(); i++) {
                JSONObject o = arr.getJSONObject(i);
                BotAccount b = new BotAccount(
                        o.getString("token"), o.getLong("id"),
                        o.optString("username", ""), o.optString("first_name", ""));
                b.updatesOffset = o.optLong("offset", 0);
                out.add(b);
            }
        } catch (Exception ignored) {}
        return out;
    }

    public static void save(Context c, List<BotAccount> list) {
        JSONArray arr = new JSONArray();
        try {
            for (BotAccount b : list) {
                JSONObject o = new JSONObject();
                o.put("token", b.token);
                o.put("id", b.botId);
                o.put("username", b.username);
                o.put("first_name", b.firstName);
                o.put("offset", b.updatesOffset);
                arr.put(o);
            }
        } catch (Exception ignored) {}
        prefs(c).edit().putString("list", arr.toString()).apply();
    }

    public static void add(Context c, BotAccount b) {
        List<BotAccount> list = load(c);
        for (BotAccount x : list) if (x.botId == b.botId) { list.remove(x); break; }
        list.add(b);
        save(c, list);
    }

    public static void remove(Context c, long botId) {
        List<BotAccount> list = load(c);
        list.removeIf(x -> x.botId == botId);
        save(c, list);
    }

    public static void updateOffset(Context c, long botId, long offset) {
        List<BotAccount> list = load(c);
        for (BotAccount b : list) {
            if (b.botId == botId) { b.updatesOffset = offset; break; }
        }
        save(c, list);
    }
}
