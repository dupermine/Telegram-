name: Build Telegram fork
on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/**'
      - '.github/workflows/build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Сменить имя пакета
        env:
          NEW_PKG: com.dupermine.tgfork
        run: |
          FILES=$(grep -rlE '^\s*(ext\.)?APP_PACKAGE\s*=' --include=*.properties --include=*.gradle --include=*.kts . | grep -v "/build/" || true)
          if [ -z "$FILES" ]; then
            echo "ОШИБКА: определение APP_PACKAGE не найдено"
            exit 1
          fi
          for F in $FILES; do
            perl -pi -e 's/^(\s*(?:ext\.)?APP_PACKAGE\s*=\s*)(["\x27]?)[^"\x27\r\n]+\2(\r?)$/$1$2$ENV{NEW_PKG}$2$3/' "$F"
          done
          if ! grep -q "$NEW_PKG" $FILES; then
            echo "ОШИБКА: APP_PACKAGE не заменён"
            exit 1
          fi
          for M in $(find . -name AndroidManifest.xml -not -path "*/build/*"); do
            sed -i -E 's/android:name="org\.telegram\.messenger(\.web|\.beta)?\.permission\./android:name="${applicationId}.permission./g' "$M"
            sed -i -E 's/android:authorities="org\.telegram\.messenger(\.web|\.beta)?\./android:authorities="${applicationId}./g' "$M"
          done
          python3 - <<'PY'
          import copy, glob, json, os
          new = os.environ["NEW_PKG"]
          targets = [new, new + ".web", new + ".beta"]
          for f in glob.glob("**/google-services.json", recursive=True):
              if "/build/" in f: continue
              with open(f, encoding="utf-8") as fh: data = json.load(fh)
              clients = data.get("client", [])
              if not clients: continue
              have = {c["client_info"]["android_client_info"]["package_name"] for c in clients}
              base = clients[0]
              for t in targets:
                  if t in have: continue
                  c = copy.deepcopy(base)
                  c["client_info"]["android_client_info"]["package_name"] = t
                  clients.append(c)
              with open(f, "w", encoding="utf-8") as fh: json.dump(data, fh, ensure_ascii=False, indent=2)
              print("обновлён:", f)
          PY

      - name: Добавить файлы (боты, tdata, KT Tools, обновления)
        run: |
          mkdir -p TMessagesProj/src/main/java/org/telegram/messenger/bots
          mkdir -p TMessagesProj/src/main/java/org/telegram/messenger/tdimport
          echo '' | base64 -d > TMessagesProj/src/main/java/org/telegram/messenger/bots/BotApiClient.java
          echo 'создан: TMessagesProj/src/main/java/org/telegram/messenger/bots/BotApiClient.java'
          echo '' | base64 -d > TMessagesProj/src/main/java/org/telegram/messenger/bots/BotAccount.java
          echo 'создан: TMessagesProj/src/main/java/org/telegram/messenger/bots/BotAccount.java'
          echo '' | base64 -d > TMessagesProj/src/main/java/org/telegram/messenger/bots/BotAccountsStore.java
          echo 'создан: TMessagesProj/src/main/java/org/telegram/messenger/bots/BotAccountsStore.java'
          echo '' | base64 -d > TMessagesProj/src/main/java/org/telegram/messenger/bots/BotPollingService.java
          echo 'создан: TMessagesProj/src/main/java/org/telegram/messenger/bots/BotPollingService.java'
          echo '' | base64 -d > TMessagesProj/src/main/java/org/telegram/messenger/tdimport/TDataImporter.java
          echo 'создан: TMessagesProj/src/main/java/org/telegram/messenger/tdimport/TDataImporter.java'
          echo '' | base64 -d > TMessagesProj/src/main/java/org/telegram/messenger/bots/BotLoginActivity.java
          echo 'создан: TMessagesProj/src/main/java/org/telegram/messenger/bots/BotLoginActivity.java'
          echo '' | base64 -d > TMessagesProj/src/main/java/org/telegram/messenger/tdimport/TdataImportActivity.java
          echo 'создан: TMessagesProj/src/main/java/org/telegram/messenger/tdimport/TdataImportActivity.java'
          echo '' | base64 -d > TMessagesProj/src/main/java/org/telegram/messenger/bots/UpdateChecker.java
          echo 'создан: TMessagesProj/src/main/java/org/telegram/messenger/bots/UpdateChecker.java'
          echo '' | base64 -d > TMessagesProj/src/main/java/org/telegram/messenger/bots/KtToolsActivity.java
          echo 'создан: TMessagesProj/src/main/java/org/telegram/messenger/bots/KtToolsActivity.java'

      - name: Добавить новые экраны в манифест (безопасная вставка перед </application>)
        run: |
          python3 - <<'PY'
          import glob
          import re

          BLOCK = """
              <activity android:name="org.telegram.messenger.bots.KtToolsActivity"
                  android:exported="true"
                  android:label="KT Tools">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
              <activity android:name="org.telegram.messenger.bots.BotLoginActivity"
                  android:exported="false"
                  android:label="Войти как бот" />
              <activity android:name="org.telegram.messenger.tdimport.TdataImportActivity"
                  android:exported="false"
                  android:label="Импорт tdata" />
          """

          MARKER = "org.telegram.messenger.bots.KtToolsActivity"

          changed = 0
          candidates = [f for f in glob.glob("**/AndroidManifest.xml", recursive=True) if "/build/" not in f]
          targets = [f for f in candidates if ".ui.LoginActivity" in open(f, encoding="utf-8", errors="ignore").read()
                     or "org.telegram.ui.LoginActivity" in open(f, encoding="utf-8", errors="ignore").read()]
          if not targets:
              # запасной вариант: манифест AppStandalone, если точного совпадения не нашлось
              targets = [f for f in candidates if "AppStandalone" in f]

          print("Манифесты-кандидаты:", candidates)
          print("Выбранные манифесты:", targets)

          if not targets:
              print("ОШИБКА: не найден подходящий AndroidManifest.xml")
              raise SystemExit(1)

          for path in targets:
              s = open(path, encoding="utf-8").read()
              if MARKER in s:
                  print("уже добавлено, пропуск:", path)
                  continue
              idx = s.rfind("</application>")
              if idx == -1:
                  print("ПРЕДУПРЕЖДЕНИЕ: </application> не найден в", path)
                  continue
              s = s[:idx] + BLOCK + s[idx:]
              open(path, "w", encoding="utf-8").write(s)
              changed += 1
              print("вставлено в:", path)

          if changed == 0:
              print("ОШИБКА: не удалось вставить ни в один манифест")
              raise SystemExit(1)
          PY

      - name: Применить патчи (из patches/apply.py)
        run: python3 patches/apply.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK, NDK, CMake
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Кэш нативной сборки (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('TMessagesProj/jni/**') }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Настроить ccache
        run: |
          sudo apt-get update -y && sudo apt-get install -y ccache
          mkdir -p ~/.ccache
          echo "max_size = 2.0G" > ~/.ccache/ccache.conf
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"

      - name: Сборка
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache --stacktrace :TMessagesProj_AppStandalone:assembleAfatStandalone 2>&1 | tee build.log

      - name: Выложить ошибки сборки (только при падении)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pub
          {
            echo "=== место на диске ==="; df -h / | tail -2
            echo; echo "=== ключевые строки ==="
            grep -n -E "error:|FAILED|What went wrong|Caused by|OutOfMemory|No space left|Execution failed|Could not|No matching client" build.log | cut -c1-300 | head -80
            echo; echo "=== последние 120 строк ==="
            tail -120 build.log | cut -c1-300
          } > /tmp/pub/buildlog.txt
          cd /tmp/pub
          git init -q -b recon-out
          git config user.name "recon-bot"
          git config user.email "recon@users.noreply.github.com"
          git add buildlog.txt
          git commit -q -m "build log"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin recon-out
          RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/recon-out/buildlog.txt"
          echo "- Лог ошибки (пришли Claude): $RAW" >> "$GITHUB_STEP_SUMMARY"

      - name: Показать найденные APK
        run: find . -name "*.apk" -not -path "./.git/*" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-fork-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
      - name: Опубликовать релиз и обновить version.json (OTA)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(find . -name "*.apk" -not -path "./.git/*" | head -1)
          if [ -z "$APK" ]; then echo "APK не найден, пропуск релиза"; exit 0; fi

          CUR_CODE=$(python3 -c "import json;print(json.load(open('version.json')).get('versionCode',0))" 2>/dev/null || echo 0)
          NEW_CODE=$((CUR_CODE + 1))
          TAG="build-$NEW_CODE"

          gh release create "$TAG" "$APK" \
            --title "Сборка #$NEW_CODE" \
            --notes "Автоматическая сборка форка. Коммит: ${GITHUB_SHA::7}" \
            --repo "$GITHUB_REPOSITORY" || \
          gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"

          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$APK")"

          python3 - <<PY
          import json
          data = {
              "versionCode": $NEW_CODE,
              "versionName": "$TAG",
              "apkUrl": "$APK_URL",
              "notes": "Автосборка из коммита ${GITHUB_SHA::7}"
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add version.json
          git commit -m "version.json: build $NEW_CODE [skip ci]" || echo "нечего коммитить"
          git push origin HEAD:main || git push origin HEAD:master || true

          echo "- APK: $APK_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- version.json обновлён до versionCode=$NEW_CODE" >> "$GITHUB_STEP_SUMMARY"

